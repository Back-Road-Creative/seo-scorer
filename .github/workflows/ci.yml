name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[store,dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  bare-install:
    # The scoring half must work with no third-party packages at all.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Assert nothing third-party was installed
        run: |
          python - <<'PY'
          import importlib.util, sys
          assert importlib.util.find_spec("filelock") is None, "filelock leaked in"
          PY

      - name: Import and score
        run: |
          python - <<'PY'
          from seo_scorer import SEOScorer
          score = SEOScorer().seo_structure_score("x" * 50, "x" * 400, ["x"] * 12)
          assert score == 1.0, score
          print("bare install OK, score:", score)
          PY
