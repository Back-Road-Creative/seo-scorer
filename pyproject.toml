[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seo-scorer"
version = "0.1.0"
description = "Dependency-free SEO metadata scoring, with an optional append-only event store"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "backroadcreativeco@gmail.com" }]
keywords = ["seo", "metadata", "readability", "flesch", "event-store"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# The scoring half of the package imports nothing outside the standard
# library. Keep this list empty.
dependencies = []

[project.optional-dependencies]
# seo_scorer.store only.
store = ["filelock>=3.12"]
dev = ["pytest>=7.4", "ruff>=0.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["seo_scorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--tb=short"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests reach for private helpers on purpose.
"tests/*" = ["SLF001"]
